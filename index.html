<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Lens Mirror — 안경 제거 시뮬레이터</title>
<style>
  :root {
    --teal: #028090;
    --teal-dark: #07333A;
    --accent: #02C39A;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
    overflow: hidden;
  }
  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: #000;
  }
  /* Video shows the real live mirror image. Canvas sits on top, transparent,
     and only paints the small skin patch that covers the glasses area. Both
     are mirrored identically so the patch always lines up with the face. */
  video, canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
  }

  #ui {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 20px 24px calc(28px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(0,0,0,0.65), transparent);
  }
  #status {
    color: #fff;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(6px);
    padding: 7px 16px;
    border-radius: 999px;
    font-size: 14px;
  }
  #toggleBtn {
    width: 100%;
    max-width: 420px;
    padding: 16px;
    border: none;
    border-radius: 999px;
    font-size: 17px;
    font-weight: 700;
    color: #fff;
    background: var(--teal);
    transition: background 0.2s;
  }
  #toggleBtn.on { background: #c0392b; }
  #toggleBtn:disabled { background: #555; }

  #loading, #error {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    color: #fff;
    text-align: center;
    padding: 0 30px;
    background: var(--teal-dark);
  }
  #error { display: none; background: #3a0f0f; }
  .spinner {
    width: 34px; height: 34px;
    border: 3px solid rgba(255,255,255,0.25);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="stage">
  <video id="video" playsinline autoplay muted></video>
  <canvas id="canvas"></canvas>

  <div id="ui">
    <div id="status">카메라 준비 중…</div>
    <button id="toggleBtn" disabled>렌즈 착용 (안경 지우기)</button>
  </div>

  <div id="loading">
    <div class="spinner"></div>
    <div>얼굴 인식 모델을 불러오는 중입니다…</div>
  </div>

  <div id="error">
    <div style="font-size:17px; font-weight:700;">카메라를 사용할 수 없습니다</div>
    <div id="errorDetail" style="font-size:13px; opacity:0.85; line-height:1.5;"></div>
  </div>
</div>

<script type="module">
import {
  FaceLandmarker,
  FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const statusEl = document.getElementById("status");
const toggleBtn = document.getElementById("toggleBtn");
const loadingEl = document.getElementById("loading");
const errorEl = document.getElementById("errorDetail");
const errorBox = document.getElementById("error");

let lensOn = false;
let faceLandmarker = null;
let lastVideoTime = -1;

// Reused offscreen canvas so we don't allocate a new one every frame.
const maskCanvas = document.createElement("canvas");
const maskCtx = maskCanvas.getContext("2d");
const sampleCanvas = document.createElement("canvas");
sampleCanvas.width = 1;
sampleCanvas.height = 1;
const sampleCtx = sampleCanvas.getContext("2d", { willReadFrequently: true });

// Landmark indices from MediaPipe's 468-point face mesh.
// (Meaning is fixed by the model — these don't change with mirroring.)
const EYEBROW_A = 105, EYEBROW_B = 334;    // top of each eyebrow
const EYE_LOWER_A = 145, EYE_LOWER_B = 374; // lower eyelid
const TEMPLE_A = 127, TEMPLE_B = 356;       // temple / outer cheek

// Points that are skin no matter what — never covered by bangs, glasses
// frames, or background, regardless of camera distance or hairstyle.
const SAFE_SKIN_POINTS = [4, 6, 205, 425]; // nose tip, nose bridge, left cheek, right cheek

// Exponential moving average of the sampled skin tone, to stop the patch
// from flickering in color as the face/landmarks jitter slightly frame to frame.
let smoothedColor = null;

function sampleAverageColor(landmarks, W, H) {
  let r = 0, g = 0, b = 0, count = 0;
  for (const idx of SAFE_SKIN_POINTS) {
    const lm = landmarks[idx];
    if (!lm) continue;
    const x = lm.x * W, y = lm.y * H;
    const size = 8; // sample an 8x8 px neighborhood, downscaled to 1px (cheap blur/average)
    sampleCtx.drawImage(video, x - size / 2, y - size / 2, size, size, 0, 0, 1, 1);
    const [pr, pg, pb] = sampleCtx.getImageData(0, 0, 1, 1).data;
    r += pr; g += pg; b += pb; count++;
  }
  if (count === 0) return smoothedColor;
  const fresh = { r: r / count, g: g / count, b: b / count };
  if (!smoothedColor) {
    smoothedColor = fresh;
  } else {
    const a = 0.15; // smoothing factor
    smoothedColor = {
      r: smoothedColor.r * (1 - a) + fresh.r * a,
      g: smoothedColor.g * (1 - a) + fresh.g * a,
      b: smoothedColor.b * (1 - a) + fresh.b * a
    };
  }
  return smoothedColor;
}

function showError(message) {
  loadingEl.style.display = "none";
  errorBox.style.display = "flex";
  errorEl.textContent = message;
}

async function setup() {
  try {
    const filesetResolver = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
    );
    faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
      baseOptions: {
        modelAssetPath:
          "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
        delegate: "GPU"
      },
      runningMode: "VIDEO",
      numFaces: 1
    });

    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    video.srcObject = stream;

    await new Promise((resolve) => {
      video.onloadedmetadata = () => {
        video.play();
        resolve();
      };
    });

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    loadingEl.style.display = "none";
    statusEl.textContent = "안경 쓴 모습 (기본 카메라)";
    toggleBtn.disabled = false;
    requestAnimationFrame(renderLoop);
  } catch (err) {
    console.error(err);
    if (err.name === "NotAllowedError") {
      showError("카메라 권한이 거부되었습니다. 브라우저 설정에서 카메라 접근을 허용한 뒤 새로고침 해주세요.");
    } else if (location.protocol !== "https:" && location.hostname !== "localhost") {
      showError("카메라 접근에는 HTTPS 연결이 필요합니다. (GitHub Pages 주소는 자동으로 HTTPS입니다.)");
    } else {
      showError(err.message || "알 수 없는 오류가 발생했습니다.");
    }
  }
}

function renderLoop() {
  if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (lensOn) {
      const result = faceLandmarker.detectForVideo(video, performance.now());
      const faces = result.faceLandmarks;
      if (faces && faces.length > 0) {
        removeGlasses(faces[0]);
      }
    }
  }
  requestAnimationFrame(renderLoop);
}

/**
 * "Removes" glasses by covering the glasses region (eyebrows -> lower
 * eyelids, temple to temple) with a soft, feathered oval filled in the
 * wearer's own average skin tone. The tone is sampled live every frame
 * from spots that are essentially always visible skin — nose tip, nose
 * bridge, and both cheeks — so it never accidentally grabs hair or
 * background the way copying a forehead patch could.
 */
function removeGlasses(landmarks) {
  const W = canvas.width, H = canvas.height;
  const p = (i) => ({ x: landmarks[i].x * W, y: landmarks[i].y * H });

  const browA = p(EYEBROW_A), browB = p(EYEBROW_B);
  const lowerA = p(EYE_LOWER_A), lowerB = p(EYE_LOWER_B);
  const templeA = p(TEMPLE_A), templeB = p(TEMPLE_B);

  const padX = 0.16; // horizontal breathing room beyond the temples (covers the arms of the frame)

  let xMin = Math.min(templeA.x, templeB.x, browA.x, browB.x);
  let xMax = Math.max(templeA.x, templeB.x, browA.x, browB.x);
  const boxW = xMax - xMin;

  // Glasses run from above the eyebrows down onto the upper cheek/nose bridge —
  // a much bigger span than the eyebrow-to-lower-eyelid gap alone. Size the
  // patch off the face WIDTH (a stable reference) instead, centered on the
  // eye line, so it reliably covers the whole frame regardless of face shape.
  const eyeLineY = (Math.min(browA.y, browB.y) + Math.max(lowerA.y, lowerB.y)) / 2;
  const halfHeight = boxW * 0.34;

  xMin -= boxW * padX;
  xMax += boxW * padX;
  let yTop = eyeLineY - halfHeight;
  let yBottom = eyeLineY + halfHeight * 1.25; // a bit more room below, toward the cheek/nose bridge

  const destX = Math.max(0, xMin);
  const destY = Math.max(0, yTop);
  const destW = Math.min(W, xMax) - destX;
  const destH = Math.min(H, yBottom) - destY;
  if (destW <= 0 || destH <= 0) return;

  const color = sampleAverageColor(landmarks, W, H);
  if (!color) return;
  const { r, g, b } = color;

  const w = Math.round(destW), h = Math.round(destH);
  maskCanvas.width = w;
  maskCanvas.height = h;

  // Soft-edged oval: solid skin tone in the middle, feathering to fully
  // transparent at the rim so it blends into the real skin around it
  // instead of showing a hard-edged sticker.
  maskCtx.clearRect(0, 0, w, h);
  const cx = w / 2, cy = h / 2;
  const gradient = maskCtx.createRadialGradient(cx, cy, Math.min(w, h) * 0.15, cx, cy, Math.max(w, h) * 0.62);
  gradient.addColorStop(0, `rgba(${r},${g},${b},0.97)`);
  gradient.addColorStop(0.7, `rgba(${r},${g},${b},0.9)`);
  gradient.addColorStop(1, `rgba(${r},${g},${b},0)`);
  maskCtx.fillStyle = gradient;
  maskCtx.beginPath();
  maskCtx.ellipse(cx, cy, w / 2, h / 2, 0, 0, Math.PI * 2);
  maskCtx.fill();

  ctx.drawImage(maskCanvas, destX, destY, destW, destH);
}

toggleBtn.addEventListener("click", () => {
  lensOn = !lensOn;
  toggleBtn.textContent = lensOn ? "안경 다시 보기" : "렌즈 착용 (안경 지우기)";
  toggleBtn.classList.toggle("on", lensOn);
  statusEl.textContent = lensOn ? "렌즈 착용 (안경 제거됨)" : "안경 쓴 모습 (기본 카메라)";
  if (!lensOn) ctx.clearRect(0, 0, canvas.width, canvas.height);
});

setup();
</script>
</body>
</html>
