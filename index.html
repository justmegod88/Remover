<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Lens Mirror — 안경 제거 시뮬레이터</title>
<style>
  :root {
    --teal: #028090;
    --teal-dark: #07333A;
    --accent: #02C39A;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
    overflow: hidden;
  }
  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: #000;
  }
  /* Video shows the real live mirror image. Canvas sits on top, transparent,
     and only paints the small skin patch that covers the glasses area. Both
     are mirrored identically so the patch always lines up with the face. */
  video, canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
  }

  #ui {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 20px 24px calc(28px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(0,0,0,0.65), transparent);
  }
  #status {
    color: #fff;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(6px);
    padding: 7px 16px;
    border-radius: 999px;
    font-size: 14px;
  }
  #toggleBtn {
    width: 100%;
    max-width: 420px;
    padding: 16px;
    border: none;
    border-radius: 999px;
    font-size: 17px;
    font-weight: 700;
    color: #fff;
    background: var(--teal);
    transition: background 0.2s;
  }
  #toggleBtn.on { background: #c0392b; }
  #toggleBtn:disabled { background: #555; }

  #loading, #error {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    color: #fff;
    text-align: center;
    padding: 0 30px;
    background: var(--teal-dark);
  }
  #error { display: none; background: #3a0f0f; }
  .spinner {
    width: 34px; height: 34px;
    border: 3px solid rgba(255,255,255,0.25);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="stage">
  <video id="video" playsinline autoplay muted></video>
  <canvas id="canvas"></canvas>

  <div id="ui">
    <div id="status">카메라 준비 중…</div>
    <button id="toggleBtn" disabled>렌즈 착용 (안경 지우기)</button>
  </div>

  <div id="loading">
    <div class="spinner"></div>
    <div>얼굴 인식 모델을 불러오는 중입니다…</div>
  </div>

  <div id="error">
    <div style="font-size:17px; font-weight:700;">카메라를 사용할 수 없습니다</div>
    <div id="errorDetail" style="font-size:13px; opacity:0.85; line-height:1.5;"></div>
  </div>
</div>

<script type="module">
import {
  FaceLandmarker,
  FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const statusEl = document.getElementById("status");
const toggleBtn = document.getElementById("toggleBtn");
const loadingEl = document.getElementById("loading");
const errorEl = document.getElementById("errorDetail");
const errorBox = document.getElementById("error");

let lensOn = false;
let faceLandmarker = null;
let lastVideoTime = -1;

// Reused offscreen canvases so we don't allocate new ones every frame.
const patchCanvas = document.createElement("canvas");
const patchCtx = patchCanvas.getContext("2d");
const maskCanvas = document.createElement("canvas");
const maskCtx = maskCanvas.getContext("2d");

// Landmark indices from MediaPipe's 468-point face mesh.
// (Meaning is fixed by the model — these don't change with mirroring.)
const EYEBROW_A = 105, EYEBROW_B = 334;    // top of each eyebrow
const EYE_LOWER_A = 145, EYE_LOWER_B = 374; // lower eyelid
const TEMPLE_A = 127, TEMPLE_B = 356;       // temple / outer cheek

function showError(message) {
  loadingEl.style.display = "none";
  errorBox.style.display = "flex";
  errorEl.textContent = message;
}

async function setup() {
  try {
    const filesetResolver = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
    );
    faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
      baseOptions: {
        modelAssetPath:
          "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
        delegate: "GPU"
      },
      runningMode: "VIDEO",
      numFaces: 1
    });

    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    video.srcObject = stream;

    await new Promise((resolve) => {
      video.onloadedmetadata = () => {
        video.play();
        resolve();
      };
    });

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    loadingEl.style.display = "none";
    statusEl.textContent = "안경 쓴 모습 (기본 카메라)";
    toggleBtn.disabled = false;
    requestAnimationFrame(renderLoop);
  } catch (err) {
    console.error(err);
    if (err.name === "NotAllowedError") {
      showError("카메라 권한이 거부되었습니다. 브라우저 설정에서 카메라 접근을 허용한 뒤 새로고침 해주세요.");
    } else if (location.protocol !== "https:" && location.hostname !== "localhost") {
      showError("카메라 접근에는 HTTPS 연결이 필요합니다. (GitHub Pages 주소는 자동으로 HTTPS입니다.)");
    } else {
      showError(err.message || "알 수 없는 오류가 발생했습니다.");
    }
  }
}

function renderLoop() {
  if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (lensOn) {
      const result = faceLandmarker.detectForVideo(video, performance.now());
      const faces = result.faceLandmarks;
      if (faces && faces.length > 0) {
        removeGlasses(faces[0]);
      }
    }
  }
  requestAnimationFrame(renderLoop);
}

/**
 * "Removes" glasses by cloning a same-sized patch of forehead skin from
 * directly above the eyebrows and blending it — with a soft, feathered
 * edge — over the glasses region (eyebrows -> lower eyelids, temple to
 * temple). This is a texture-cloning trick, not true inpainting, but for
 * a consultation-room demo it reads convincingly as "no glasses."
 */
function removeGlasses(landmarks) {
  const W = canvas.width, H = canvas.height;
  const p = (i) => ({ x: landmarks[i].x * W, y: landmarks[i].y * H });

  const browA = p(EYEBROW_A), browB = p(EYEBROW_B);
  const lowerA = p(EYE_LOWER_A), lowerB = p(EYE_LOWER_B);
  const templeA = p(TEMPLE_A), templeB = p(TEMPLE_B);

  const padX = 0.12;      // horizontal breathing room beyond the temples
  const padTop = 0.35;    // room above the eyebrows (typical frame height)
  const padBottom = 0.25; // room below the lower eyelid

  let xMin = Math.min(templeA.x, templeB.x, browA.x, browB.x);
  let xMax = Math.max(templeA.x, templeB.x, browA.x, browB.x);
  let yTop = Math.min(browA.y, browB.y);
  let yBottom = Math.max(lowerA.y, lowerB.y);

  const boxW = xMax - xMin;
  const boxH = yBottom - yTop;

  xMin -= boxW * padX;
  xMax += boxW * padX;
  yTop -= boxH * padTop;
  yBottom += boxH * padBottom;

  const destX = Math.max(0, xMin);
  const destY = Math.max(0, yTop);
  const destW = Math.min(W, xMax) - destX;
  const destH = Math.min(H, yBottom) - destY;
  if (destW <= 0 || destH <= 0) return;

  // Source patch: same size, sampled from higher up on the forehead
  // (clean skin, same lighting, no glasses ever present there).
  let srcY = destY - destH * 1.05;
  if (srcY < 0) srcY = Math.max(0, destY - destH * 0.5); // fallback if forehead is short

  const w = Math.round(destW), h = Math.round(destH);
  patchCanvas.width = w;
  patchCanvas.height = h;
  maskCanvas.width = w;
  maskCanvas.height = h;

  // 1) Clone the skin texture.
  patchCtx.clearRect(0, 0, w, h);
  patchCtx.drawImage(video, destX, srcY, destW, destH, 0, 0, w, h);

  // 2) Build a soft-edged oval mask (opaque center, fading to transparent).
  maskCtx.clearRect(0, 0, w, h);
  const cx = w / 2, cy = h / 2;
  const gradient = maskCtx.createRadialGradient(cx, cy, Math.min(w, h) * 0.25, cx, cy, Math.max(w, h) * 0.62);
  gradient.addColorStop(0, "rgba(255,255,255,1)");
  gradient.addColorStop(0.75, "rgba(255,255,255,1)");
  gradient.addColorStop(1, "rgba(255,255,255,0)");
  maskCtx.fillStyle = gradient;
  maskCtx.beginPath();
  maskCtx.ellipse(cx, cy, w / 2, h / 2, 0, 0, Math.PI * 2);
  maskCtx.fill();

  // 3) Cut the clone down to that soft oval shape.
  patchCtx.globalCompositeOperation = "destination-in";
  patchCtx.drawImage(maskCanvas, 0, 0);
  patchCtx.globalCompositeOperation = "source-over";

  // 4) Paste the feathered patch over the glasses area.
  ctx.drawImage(patchCanvas, destX, destY, destW, destH);
}

toggleBtn.addEventListener("click", () => {
  lensOn = !lensOn;
  toggleBtn.textContent = lensOn ? "안경 다시 보기" : "렌즈 착용 (안경 지우기)";
  toggleBtn.classList.toggle("on", lensOn);
  statusEl.textContent = lensOn ? "렌즈 착용 (안경 제거됨)" : "안경 쓴 모습 (기본 카메라)";
  if (!lensOn) ctx.clearRect(0, 0, canvas.width, canvas.height);
});

setup();
</script>
</body>
</html>
