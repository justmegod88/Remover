<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Lens Mirror — 안경 제거 시뮬레이터</title>
<style>
  :root {
    --teal: #028090;
    --teal-dark: #07333A;
    --accent: #02C39A;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
    overflow: hidden;
  }
  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: #000;
  }
  /* Video shows the real live mirror image. Canvas sits on top, transparent,
     and only paints the small skin patch that covers the glasses area. Both
     are mirrored identically so the patch always lines up with the face. */
  video, canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
  }

  #ui {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 20px 24px calc(28px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(0,0,0,0.65), transparent);
  }
  #status {
    color: #fff;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(6px);
    padding: 7px 16px;
    border-radius: 999px;
    font-size: 14px;
  }
  #toggleBtn {
    width: 100%;
    max-width: 420px;
    padding: 16px;
    border: none;
    border-radius: 999px;
    font-size: 17px;
    font-weight: 700;
    color: #fff;
    background: var(--teal);
    transition: background 0.2s;
  }
  #toggleBtn.on { background: #c0392b; }
  #toggleBtn:disabled { background: #555; }

  #loading, #error {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    color: #fff;
    text-align: center;
    padding: 0 30px;
    background: var(--teal-dark);
  }
  #error { display: none; background: #3a0f0f; }
  .spinner {
    width: 34px; height: 34px;
    border: 3px solid rgba(255,255,255,0.25);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="stage">
  <video id="video" playsinline autoplay muted></video>
  <canvas id="canvas"></canvas>

  <div id="ui">
    <div id="status">카메라 준비 중…</div>
    <button id="toggleBtn" disabled>렌즈 착용 (안경 지우기)</button>
  </div>

  <div id="loading">
    <div class="spinner"></div>
    <div>얼굴 인식 모델을 불러오는 중입니다…</div>
  </div>

  <div id="error">
    <div style="font-size:17px; font-weight:700;">카메라를 사용할 수 없습니다</div>
    <div id="errorDetail" style="font-size:13px; opacity:0.85; line-height:1.5;"></div>
  </div>
</div>

<script type="module">
import {
  FaceLandmarker,
  FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const statusEl = document.getElementById("status");
const toggleBtn = document.getElementById("toggleBtn");
const loadingEl = document.getElementById("loading");
const errorEl = document.getElementById("errorDetail");
const errorBox = document.getElementById("error");

let lensOn = false;
let faceLandmarker = null;
let lastVideoTime = -1;

// Reused 1x1 canvas for cheap color sampling, so we don't allocate a new one every frame.
const sampleCanvas = document.createElement("canvas");
sampleCanvas.width = 1;
sampleCanvas.height = 1;
const sampleCtx = sampleCanvas.getContext("2d", { willReadFrequently: true });
const removalLayer = document.createElement("canvas");
const removalCtx = removalLayer.getContext("2d");


// Landmark indices from MediaPipe's 468-point face mesh.
// (Meaning is fixed by the model — these don't change with mirroring.)
const EYEBROW_A = 105, EYEBROW_B = 334;      // top of each eyebrow
const EYE_LOWER_A = 145, EYE_LOWER_B = 374;  // lower eyelid
const EYE_OUTER_A = 33, EYE_OUTER_B = 263;   // outer eye corner (temple side)
const EYE_INNER_A = 133, EYE_INNER_B = 362;  // inner eye corner (nose side)
const TEMPLE_A = 127, TEMPLE_B = 356;        // temple / outer cheek

// Points that are skin no matter what — never covered by bangs, glasses
// frames, or background, regardless of camera distance or hairstyle.
const SAFE_SKIN_POINTS = [4, 6, 205, 425]; // nose tip, nose bridge, left cheek, right cheek

// Exponential moving average of the sampled skin tone, to stop the patch
// from flickering in color as the face/landmarks jitter slightly frame to frame.
let smoothedColor = null;

function sampleAverageColor(landmarks, W, H) {
  let r = 0, g = 0, b = 0, count = 0;
  for (const idx of SAFE_SKIN_POINTS) {
    const lm = landmarks[idx];
    if (!lm) continue;
    const x = lm.x * W, y = lm.y * H;
    const size = 8; // sample an 8x8 px neighborhood, downscaled to 1px (cheap blur/average)
    sampleCtx.drawImage(video, x - size / 2, y - size / 2, size, size, 0, 0, 1, 1);
    const [pr, pg, pb] = sampleCtx.getImageData(0, 0, 1, 1).data;
    r += pr; g += pg; b += pb; count++;
  }
  if (count === 0) return smoothedColor;
  const fresh = { r: r / count, g: g / count, b: b / count };
  if (!smoothedColor) {
    smoothedColor = fresh;
  } else {
    const a = 0.15; // smoothing factor
    smoothedColor = {
      r: smoothedColor.r * (1 - a) + fresh.r * a,
      g: smoothedColor.g * (1 - a) + fresh.g * a,
      b: smoothedColor.b * (1 - a) + fresh.b * a
    };
  }
  return smoothedColor;
}

function showError(message) {
  loadingEl.style.display = "none";
  errorBox.style.display = "flex";
  errorEl.textContent = message;
}

async function setup() {
  try {
    const filesetResolver = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
    );
    faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
      baseOptions: {
        modelAssetPath:
          "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
        delegate: "GPU"
      },
      runningMode: "VIDEO",
      numFaces: 1
    });

    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    video.srcObject = stream;

    await new Promise((resolve) => {
      video.onloadedmetadata = () => {
        video.play();
        resolve();
      };
    });

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    loadingEl.style.display = "none";
    statusEl.textContent = "안경 쓴 모습 (기본 카메라)";
    toggleBtn.disabled = false;
    requestAnimationFrame(renderLoop);
  } catch (err) {
    console.error(err);
    if (err.name === "NotAllowedError") {
      showError("카메라 권한이 거부되었습니다. 브라우저 설정에서 카메라 접근을 허용한 뒤 새로고침 해주세요.");
    } else if (location.protocol !== "https:" && location.hostname !== "localhost") {
      showError("카메라 접근에는 HTTPS 연결이 필요합니다. (GitHub Pages 주소는 자동으로 HTTPS입니다.)");
    } else {
      showError(err.message || "알 수 없는 오류가 발생했습니다.");
    }
  }
}

function renderLoop() {
  if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (lensOn) {
      const result = faceLandmarker.detectForVideo(video, performance.now());
      const faces = result.faceLandmarks;
      if (faces && faces.length > 0) {
        removeGlasses(faces[0]);
      }
    }
  }
  requestAnimationFrame(renderLoop);
}

/**
 * "Removes" glasses by tracing over just the frame itself — a thin ring
 * around each eye (the lens rim), a short bridge over the nose, and two
 * short arms out toward the temples — instead of covering the whole eye
 * area. Eyes and eyebrows stay untouched; only the frame lines are painted
 * over in the wearer's own (live-sampled) skin tone, then softened with a
 * blur so the edges blend in rather than looking like a sticker.
 */
/**
 * Natural-ish glasses removal for a live mirror.
 *
 * Strategy:
 *  1) Keep the real video untouched everywhere except the glasses footprint.
 *  2) Build a glasses-shaped mask from face landmarks rather than drawing an
 *     ellipse over the whole eye.
 *  3) Protect the actual eye opening so eyes/eyelids are not painted over.
 *  4) For the frame, use a soft, multi-sample skin-color fill.
 *  5) For the lens area, use a very conservative translucent reconstruction
 *     only when the lens is clear. We deliberately do NOT invent an eye with
 *     a fake AI face on every frame, which causes temporal flicker.
 *
 * This is designed for real-time browser use. It is not a generative AI
 * inpainting model; a true tinted/opaque-lens removal needs an inpainting
 * model or a paired glasses/no-glasses model.
 */
function removeGlasses(landmarks) {
  const W = canvas.width, H = canvas.height;
  const p = (i) => ({ x: landmarks[i].x * W, y: landmarks[i].y * H });

  const color = sampleAverageColor(landmarks, W, H);
  if (!color) return;

  const eyes = [
    {
      brow: p(EYEBROW_A), lower: p(EYE_LOWER_A),
      outer: p(EYE_OUTER_A), inner: p(EYE_INNER_A), temple: p(TEMPLE_A)
    },
    {
      brow: p(EYEBROW_B), lower: p(EYE_LOWER_B),
      outer: p(EYE_OUTER_B), inner: p(EYE_INNER_B), temple: p(TEMPLE_B)
    }
  ];

  const eyeWidth = Math.max(
    1,
    Math.hypot(
      eyes[0].outer.x - eyes[0].inner.x,
      eyes[0].outer.y - eyes[0].inner.y
    )
  );

  // The face mesh gives us eye landmarks, but not the exact glasses frame.
  // Use a narrow footprint around each eye and keep a larger "eye opening"
  // completely untouched.
  const frameW = Math.max(3, eyeWidth * 0.12);
  const outerPadX = eyeWidth * 0.23;
  const outerPadY = eyeWidth * 0.18;
  const eyePadX = eyeWidth * 0.035;
  const eyePadY = eyeWidth * 0.045;

  // Draw into a temporary layer at video resolution.
  if (removalLayer.width !== W || removalLayer.height !== H) {
    removalLayer.width = W;
    removalLayer.height = H;
  }
  removalCtx.clearRect(0, 0, W, H);
  const lctx = removalCtx;

  lctx.save();
  lctx.lineCap = "round";
  lctx.lineJoin = "round";

  function softStroke(points, width, alpha = 0.96) {
    lctx.save();
    lctx.filter = `blur(${Math.max(1.2, width * 0.28)}px)`;
    lctx.strokeStyle = `rgba(${color.r},${color.g},${color.b},${alpha})`;
    lctx.lineWidth = width;
    lctx.beginPath();
    lctx.moveTo(points[0].x, points[0].y);
    for (let i = 1; i < points.length; i++) {
      lctx.lineTo(points[i].x, points[i].y);
    }
    lctx.stroke();
    lctx.restore();
  }

  function ellipseMask(cx, cy, rx, ry, holeRx, holeRy) {
    // Soft outer skin fill, then punch a transparent eye opening back out.
    lctx.save();
    lctx.filter = `blur(${Math.max(1.5, frameW * 0.35)}px)`;
    lctx.fillStyle = `rgba(${color.r},${color.g},${color.b},0.94)`;
    lctx.beginPath();
    lctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
    lctx.fill();
    lctx.restore();

    // Protect the eye itself. The video remains visible through this hole.
    lctx.save();
    lctx.globalCompositeOperation = "destination-out";
    lctx.filter = `blur(${Math.max(0.7, eyeWidth * 0.018)}px)`;
    lctx.beginPath();
    lctx.ellipse(cx, cy, holeRx, holeRy, 0, 0, Math.PI * 2);
    lctx.fill();
    lctx.restore();
  }

  for (const eye of eyes) {
    const cx = (eye.outer.x + eye.inner.x) / 2;
    const cy = (eye.brow.y + eye.lower.y) / 2;

    const rx = Math.abs(eye.outer.x - eye.inner.x) / 2 + outerPadX;
    const ry = Math.max(eyeWidth * 0.28, Math.abs(eye.lower.y - eye.brow.y) / 2 + outerPadY);

    const holeRx = Math.max(eyeWidth * 0.30, Math.abs(eye.outer.x - eye.inner.x) / 2 - eyePadX);
    const holeRy = Math.max(eyeWidth * 0.13, Math.abs(eye.lower.y - eye.brow.y) / 2 - eyePadY);

    ellipseMask(cx, cy, rx, ry, holeRx, holeRy);

    // Add back a very soft narrow frame trace around the actual eye contour.
    // This avoids a visible "skin-colored sticker" edge.
    lctx.save();
    lctx.filter = "blur(1.8px)";
    lctx.strokeStyle = `rgba(${color.r},${color.g},${color.b},0.58)`;
    lctx.lineWidth = frameW;
    lctx.beginPath();
    lctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
    lctx.stroke();
    lctx.restore();
  }

  // Bridge: follow the actual inner eye corners, not a horizontal generic line.
  const bridgeStart = {
    x: eyes[0].inner.x + (eyes[0].outer.x - eyes[0].inner.x) * 0.05,
    y: eyes[0].inner.y
  };
  const bridgeEnd = {
    x: eyes[1].inner.x + (eyes[1].outer.x - eyes[1].inner.x) * 0.05,
    y: eyes[1].inner.y
  };
  const midX = (bridgeStart.x + bridgeEnd.x) / 2;
  const midY = (bridgeStart.y + bridgeEnd.y) / 2 - eyeWidth * 0.035;

  softStroke(
    [bridgeStart, { x: midX, y: midY }, bridgeEnd],
    Math.max(3, frameW * 0.9),
    0.92
  );

  // Temple arms. Use a short, tapered-looking stroke and stop before the
  // cheek so we don't erase real skin unnecessarily.
  for (const eye of eyes) {
    const dx = eye.temple.x - eye.outer.x;
    const dy = eye.temple.y - eye.outer.y;
    const len = Math.hypot(dx, dy) || 1;
    const stop = Math.min(len, eyeWidth * 0.82);
    const end = {
      x: eye.outer.x + dx * stop / len,
      y: eye.outer.y + dy * stop / len
    };
    softStroke([eye.outer, end], Math.max(3, frameW * 0.82), 0.90);
  }

  lctx.restore();

  // Composite the reconstruction over the live video.
  ctx.drawImage(removalLayer, 0, 0);

  /*
   * Important limitation:
   * If the glasses have opaque/tinted lenses, the real eye pixels are not
   * available underneath the lens. This lightweight real-time version keeps
   * the true eye pixels whenever they exist instead of hallucinating them.
   * A future "AI removal" mode can replace only the lens ROIs with an
   * inpainting model while leaving the rest of the face untouched.
   */
}

toggleBtn.addEventListener("click", () => {
  lensOn = !lensOn;
  toggleBtn.textContent = lensOn ? "안경 다시 보기" : "렌즈 착용 (안경 지우기)";
  toggleBtn.classList.toggle("on", lensOn);
  statusEl.textContent = lensOn ? "렌즈 착용 (안경 제거됨)" : "안경 쓴 모습 (기본 카메라)";
  if (!lensOn) { ctx.clearRect(0, 0, canvas.width, canvas.height); removalCtx.clearRect(0, 0, removalLayer.width, removalLayer.height); }
});

setup();
</script>
</body>
</html>
