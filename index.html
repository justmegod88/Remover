<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI 안경 제거 미러</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Malgun Gothic",sans-serif;
  overflow:hidden}
#stage{position:fixed;inset:0;background:#000}
#video,#result{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#video{transform:scaleX(-1)}
#result{display:none}
#shade{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to top,rgba(0,0,0,.78),transparent 30%,transparent 72%,rgba(0,0,0,.16))}
#top{position:absolute;top:0;left:0;right:0;padding:calc(16px + env(safe-area-inset-top)) 16px 10px;
 display:flex;justify-content:space-between;pointer-events:none}
.badge{padding:8px 13px;border-radius:999px;background:rgba(0,0,0,.45);
 border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(12px);font-size:13px}
#bottom{position:absolute;left:0;right:0;bottom:0;padding:12px 18px calc(18px + env(safe-area-inset-bottom));
 display:flex;flex-direction:column;align-items:center;gap:9px}
#message{padding:8px 14px;min-height:35px;border-radius:999px;background:rgba(0,0,0,.55);
 backdrop-filter:blur(12px);font-size:13px;text-align:center}
button{font-family:inherit}
#removeBtn,#againBtn{width:min(92vw,520px);border:0;border-radius:999px;padding:17px 20px;
 font-size:18px;font-weight:800;color:#fff}
#removeBtn{background:#ff3b30}
#removeBtn:disabled{opacity:.5}
#againBtn{display:none;background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.2)}
#loading{display:none;position:absolute;inset:0;align-items:center;justify-content:center;
 flex-direction:column;gap:14px;background:rgba(0,0,0,.42);backdrop-filter:blur(5px);z-index:10}
.spinner{width:38px;height:38px;border:3px solid rgba(255,255,255,.2);
 border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#detail{font-size:11px;color:#aaa;max-width:330px;text-align:center;line-height:1.4}
canvas{display:none}
</style>
</head>
<body>
<div id="stage">
  <video id="video" autoplay muted playsinline></video>
  <img id="result" alt="AI 안경 제거 결과">
  <div id="shade"></div>

  <div id="top">
    <div class="badge" id="status">카메라 준비 중…</div>
    <div class="badge">AI 안경 제거</div>
  </div>

  <div id="bottom">
    <div id="message">얼굴을 화면 중앙에 맞춰주세요.</div>
    <button id="removeBtn" disabled>AI 안경 제거</button>
    <button id="againBtn">안경 다시 보기</button>
    <div id="detail">버튼을 누른 순간의 한 장을 AI가 처리합니다.</div>
  </div>

  <div id="loading">
    <div class="spinner"></div>
    <div id="loadingText">AI 모델 연결 중…</div>
  </div>
</div>
<canvas id="capture"></canvas>

<script type="module">
import { Client, handle_file } from
  "https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js";

const SPACE = "mvp-lab/glasses-removal";

const video = document.getElementById("video");
const result = document.getElementById("result");
const canvas = document.getElementById("capture");
const removeBtn = document.getElementById("removeBtn");
const againBtn = document.getElementById("againBtn");
const statusEl = document.getElementById("status");
const messageEl = document.getElementById("message");
const detailEl = document.getElementById("detail");
const loading = document.getElementById("loading");
const loadingText = document.getElementById("loadingText");

let app = null;
let busy = false;
let apiInfo = null;

function msg(t){ messageEl.textContent = t; }

function showLoading(t){
  loadingText.textContent = t;
  loading.style.display = "flex";
}
function hideLoading(){ loading.style.display = "none"; }

async function camera(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:"user",width:{ideal:1280},height:{ideal:720}},
      audio:false
    });
    video.srcObject = stream;
    await video.play();
    statusEl.textContent = "카메라 ON";
    removeBtn.disabled = false;
    msg("얼굴을 화면 중앙에 맞춘 뒤 AI 안경 제거를 눌러주세요.");
  }catch(e){
    statusEl.textContent = "카메라 오류";
    msg("카메라 권한을 허용해주세요.");
    console.error(e);
  }
}

async function connect(){
  if(app) return app;
  showLoading("안경 제거 AI 연결 중…");
  app = await Client.connect(SPACE);
  apiInfo = await app.view_api();
  hideLoading();

  console.log("Glasses Removal API:", apiInfo);
  detailEl.textContent = "안경 제거 AI 연결 완료";
  return app;
}

function isImageParam(p){
  const s = ((p.component||"")+" "+(p.type||"")+" "+(p.label||"")).toLowerCase();
  return s.includes("image") || s.includes("filepath") || s.includes("file");
}
function isImageReturn(p){
  const s = ((p.component||"")+" "+(p.type||"")+" "+(p.label||"")).toLowerCase();
  return s.includes("image") || s.includes("filepath") || s.includes("file");
}

function findBestEndpoint(info){
  const named = info?.named_endpoints || {};
  const entries = Object.entries(named);

  // Prefer an endpoint with exactly one image-like input and an image-like output.
  let best = entries.find(([name,e])=>{
    const ps = e.parameters || [];
    const rs = e.returns || [];
    return ps.some(isImageParam) && rs.some(isImageReturn) && ps.filter(isImageParam).length === 1;
  });

  // Otherwise accept any endpoint with an image input and image output.
  if(!best){
    best = entries.find(([name,e])=>{
      return (e.parameters||[]).some(isImageParam) && (e.returns||[]).some(isImageReturn);
    });
  }
  return best || null;
}

function valueForParameter(p, imageBlob){
  if(isImageParam(p)) return handle_file(imageBlob);

  const s = ((p.component||"")+" "+(p.type||"")+" "+(p.label||"")).toLowerCase();

  // The dedicated Space should normally only require the image. If it exposes
  // an instruction textbox, give it a conservative glasses-removal instruction.
  if(s.includes("textbox") || s.includes("prompt") || s.includes("instruction")){
    return "Remove the eyeglasses and their lenses. Preserve the exact person, eyes, facial features, skin texture, hair, expression, lighting and background. Do not beautify or change the identity.";
  }

  if(s.includes("checkbox") || s.includes("boolean")) return false;
  if(s.includes("number") || s.includes("slider")) return 1;
  if(s.includes("dropdown") || s.includes("radio")) return null;

  return null;
}

async function capture(){
  const vw = video.videoWidth || 1280;
  const vh = video.videoHeight || 720;
  const maxW = 1024;
  const scale = Math.min(1,maxW/vw);
  canvas.width = Math.round(vw*scale);
  canvas.height = Math.round(vh*scale);

  const c = canvas.getContext("2d");
  c.save();
  // Send a normal (non-mirrored) image to the model.
  c.translate(canvas.width,0);
  c.scale(-1,1);
  c.drawImage(video,0,0,canvas.width,canvas.height);
  c.restore();

  return await new Promise(resolve=>canvas.toBlob(resolve,"image/jpeg",.94));
}

function resultUrl(x){
  if(!x) return null;
  if(typeof x === "string") return x;
  if(x.url) return x.url;
  if(x.path) return x.path;
  return null;
}

async function removeGlasses(){
  if(busy) return;
  busy = true;
  removeBtn.disabled = true;

  try{
    showLoading("AI가 안경과 렌즈를 제거하는 중…");
    msg("원래 얼굴과 눈 모양을 최대한 유지하는 중입니다.");

    const client = await connect();
    const endpoint = findBestEndpoint(apiInfo);

    if(!endpoint){
      throw new Error("이미지 입력/출력 endpoint를 찾지 못했습니다.");
    }

    const [apiName, schema] = endpoint;
    const params = schema.parameters || [];
    const blob = await capture();

    // Build inputs in the exact order reported by the Space's API.
    const inputs = params.map(p => valueForParameter(p,blob));

    // If the endpoint has unsupported required non-image parameters, fail
    // clearly rather than guessing values that could damage the result.
    const unsupported = params.some((p,i)=>{
      if(isImageParam(p)) return false;
      const s=((p.component||"")+" "+(p.type||"")+" "+(p.label||"")).toLowerCase();
      return inputs[i] === null &&
        !(s.includes("dropdown") || s.includes("radio"));
    });
    if(unsupported){
      throw new Error("이 Space의 추가 입력값을 자동으로 결정할 수 없습니다.");
    }

    detailEl.textContent = "API: " + apiName;
    const response = await client.predict(apiName, inputs);

    console.log("AI result:",response);

    const returns = response?.data || [];
    let out = null;
    for(const item of returns){
      out = resultUrl(item);
      if(out) break;
    }
    if(!out) throw new Error("AI 결과 이미지를 찾지 못했습니다.");

    result.src = out;
    await new Promise((resolve,reject)=>{
      result.onload=resolve;
      result.onerror=reject;
    });

    video.style.display="none";
    result.style.display="block";
    removeBtn.style.display="none";
    againBtn.style.display="block";
    statusEl.textContent="안경 제거 완료";
    msg("AI 안경 제거 결과");
    detailEl.textContent="결과가 마음에 들지 않으면 '안경 다시 보기'를 눌러주세요.";
  }catch(e){
    console.error(e);
    statusEl.textContent="AI 처리 오류";
    msg("AI 안경 제거에 실패했습니다.");
    detailEl.textContent=(e?.message||String(e));
    alert(
      "AI 안경 제거에 실패했습니다.\\n\\n"+
      (e?.message||String(e))+
      "\\n\\nHugging Face 모델이 대기 중이거나 GPU 사용량 제한에 걸렸을 수도 있습니다."
    );
  }finally{
    hideLoading();
    busy=false;
    removeBtn.disabled=false;
  }
}

function again(){
  result.style.display="none";
  video.style.display="block";
  removeBtn.style.display="block";
  againBtn.style.display="none";
  statusEl.textContent="카메라 ON";
  msg("얼굴을 화면 중앙에 맞춘 뒤 AI 안경 제거를 눌러주세요.");
}

removeBtn.addEventListener("click",removeGlasses);
againBtn.addEventListener("click",again);
camera();
</script>
</body>
</html>
