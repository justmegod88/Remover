<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI 안경 제거</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}
.wrap{max-width:760px;margin:auto;padding:18px 16px 40px}h1{font-size:24px;margin:8px 0}.sub{color:#aaa;font-size:14px;line-height:1.5;margin-bottom:16px}
.camera{position:relative;border-radius:20px;overflow:hidden;background:#151519;aspect-ratio:3/4}video,#result{width:100%;height:100%;object-fit:cover;display:block}video{transform:scaleX(-1)}#result{display:none;border-radius:20px}
.status{min-height:22px;color:#bbb;font-size:14px;text-align:center;margin:12px 0}button{border:0;border-radius:14px;padding:15px 18px;font-size:16px;font-weight:700;cursor:pointer}
.primary{width:100%;background:#fff;color:#111}.secondary{background:#29292f;color:#fff}.row{display:flex;gap:10px;margin-top:10px}.row button{flex:1}.hidden{display:none!important}
.badge{display:inline-block;font-size:12px;color:#bbb;background:#202026;border-radius:999px;padding:6px 10px;margin-bottom:10px}.note{font-size:12px;color:#777;line-height:1.5;margin-top:14px}
</style></head><body><div class="wrap">
<div class="badge">Replicate · Take-off Eyeglasses</div><h1>AI 안경 제거</h1>
<div class="sub">카메라로 촬영한 뒤 실제 안경 제거 AI를 실행합니다.</div>
<div id="cameraBox" class="camera"><video id="video" autoplay playsinline muted></video></div>
<img id="result" alt="AI 안경 제거 결과"><div id="status" class="status">카메라를 준비하는 중…</div>
<button id="captureBtn" class="primary">📸 촬영하고 안경 제거</button>
<div id="afterRow" class="row hidden"><button id="againBtn" class="secondary">다시 촬영</button><button id="originalBtn" class="secondary">원본 보기</button></div>
<div class="note">Replicate 비밀키는 이 HTML에 넣지 않습니다. Vercel 서버 함수가 비밀키를 보관합니다.</div>
</div>
<script>
const video=document.getElementById('video'),result=document.getElementById('result'),cameraBox=document.getElementById('cameraBox'),statusEl=document.getElementById('status'),captureBtn=document.getElementById('captureBtn'),againBtn=document.getElementById('againBtn'),originalBtn=document.getElementById('originalBtn'),afterRow=document.getElementById('afterRow');
let originalDataUrl=null, timer=null;
const status=t=>statusEl.textContent=t;
async function start(){try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:1280},height:{ideal:960}},audio:false});video.srcObject=s;await video.play();status("얼굴과 안경이 잘 보이도록 맞춰주세요.");}catch(e){status("카메라 권한을 허용해주세요.");captureBtn.disabled=true;}}
function photo(){const c=document.createElement('canvas'),ratio=video.videoWidth/video.videoHeight||.75;c.width=900;c.height=Math.round(900/ratio);c.getContext('2d').drawImage(video,0,0,c.width,c.height);let q=.78,d=c.toDataURL('image/jpeg',q);while(d.length>320000&&q>.35){q-=.06;d=c.toDataURL('image/jpeg',q)}return d;}
async function poll(id){try{const r=await fetch('/api/status?id='+encodeURIComponent(id)),d=await r.json();if(!r.ok)throw Error(d.error);if(d.status==='succeeded'&&d.output){result.src=d.output;cameraBox.classList.add('hidden');result.style.display='block';afterRow.classList.remove('hidden');captureBtn.classList.add('hidden');status("완료!");return}if(d.status==='failed'||d.status==='canceled')throw Error(d.error||"AI 처리 실패");status("AI가 안경을 제거하는 중…");timer=setTimeout(()=>poll(id),1800)}catch(e){status("오류: "+e.message);captureBtn.disabled=false}}
captureBtn.onclick=async()=>{captureBtn.disabled=true;status("사진 준비 중…");try{originalDataUrl=photo();const r=await fetch('/api/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:originalDataUrl})}),d=await r.json();if(!r.ok)throw Error(d.error);poll(d.id)}catch(e){status("오류: "+e.message);captureBtn.disabled=false}};
againBtn.onclick=()=>{result.style.display='none';cameraBox.classList.remove('hidden');afterRow.classList.add('hidden');captureBtn.classList.remove('hidden');captureBtn.disabled=false;status("다시 촬영하세요.")};
originalBtn.onclick=()=>{if(originalDataUrl){result.src=originalDataUrl;cameraBox.classList.add('hidden');result.style.display='block';status("원본 사진")}};
start();
</script></body></html>
