<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI Glasses Removal Mirror</title>
<style>
:root{
  --bg:#050505; --panel:rgba(15,15,18,.78); --line:rgba(255,255,255,.16);
  --accent:#ff3b30; --text:#fff; --muted:#b8b8bf;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Malgun Gothic",sans-serif;
  overflow:hidden}
#stage{position:fixed;inset:0;background:#000}
video,#result{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
}
video{transform:scaleX(-1)}
#result{display:none;object-fit:cover}
#shade{
  position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to top,rgba(0,0,0,.72),transparent 28%,transparent 70%,rgba(0,0,0,.12));
}
#top{
  position:absolute;top:0;left:0;right:0;padding:calc(18px + env(safe-area-inset-top)) 18px 10px;
  display:flex;justify-content:space-between;align-items:center;pointer-events:none;
}
.badge{
  padding:9px 14px;border:1px solid rgba(255,255,255,.18);border-radius:999px;
  background:rgba(0,0,0,.35);backdrop-filter:blur(12px);font-size:13px
}
#status{color:#fff}
#bottom{
  position:absolute;left:0;right:0;bottom:0;
  padding:12px 18px calc(18px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:10px;align-items:center;
}
#message{
  min-height:36px;padding:8px 14px;border-radius:999px;
  background:rgba(0,0,0,.55);backdrop-filter:blur(12px);
  font-size:13px;color:#fff;text-align:center
}
#aiBtn{
  width:min(92vw,520px);border:0;border-radius:999px;padding:17px 20px;
  font-size:18px;font-weight:800;color:#fff;background:var(--accent);
  box-shadow:0 10px 30px rgba(0,0,0,.3)
}
#aiBtn:disabled{opacity:.55}
#againBtn{
  display:none;width:min(92vw,520px);border:1px solid rgba(255,255,255,.2);
  border-radius:999px;padding:15px;background:rgba(0,0,0,.62);
  color:#fff;font-size:17px;font-weight:750;backdrop-filter:blur(12px)
}
#loading{
  position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  flex-direction:column;gap:14px;background:rgba(0,0,0,.38);backdrop-filter:blur(4px)
}
.spinner{width:38px;height:38px;border:3px solid rgba(255,255,255,.2);
  border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#hiddenCanvas{display:none}
.small{font-size:12px;color:var(--muted);max-width:330px;text-align:center;line-height:1.45}
</style>
</head>
<body>
<div id="stage">
  <video id="video" autoplay muted playsinline></video>
  <img id="result" alt="AI 안경 제거 결과">
  <div id="shade"></div>

  <div id="top">
    <div class="badge" id="status">카메라 준비 중…</div>
    <div class="badge">AI 안경 제거</div>
  </div>

  <div id="bottom">
    <div id="message">얼굴을 화면 중앙에 맞춘 뒤 AI 안경 제거를 눌러주세요.</div>
    <button id="aiBtn" disabled>AI 안경 제거</button>
    <button id="againBtn">안경 다시 보기</button>
    <div class="small">
      AI 결과는 원본 얼굴을 최대한 유지하면서 안경 영역을 복원합니다.
      모바일에서는 처리에 수 초가 걸릴 수 있습니다.
    </div>
  </div>

  <div id="loading">
    <div class="spinner"></div>
    <div id="loadingText">AI가 안경을 제거하는 중…</div>
  </div>
</div>

<canvas id="hiddenCanvas"></canvas>

<script type="module">
import { Client, handle_file } from
  "https://cdn.jsdelivr.net/npm/@gradio/client@1.4.0/+esm";

const video = document.getElementById("video");
const result = document.getElementById("result");
const canvas = document.getElementById("hiddenCanvas");
const aiBtn = document.getElementById("aiBtn");
const againBtn = document.getElementById("againBtn");
const status = document.getElementById("status");
const message = document.getElementById("message");
const loading = document.getElementById("loading");
const loadingText = document.getElementById("loadingText");

let stream = null;
let client = null;
let busy = false;

const SPACE = "mvp-lab/glasses-removal";

function setMessage(t){ message.textContent = t; }

async function startCamera(){
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:"user",
        width:{ideal:1280},
        height:{ideal:720}
      },
      audio:false
    });
    video.srcObject = stream;
    await video.play();
    status.textContent = "카메라 ON";
    aiBtn.disabled = false;
  }catch(e){
    status.textContent = "카메라 오류";
    setMessage("카메라 권한을 허용한 뒤 새로고침해주세요.");
    console.error(e);
  }
}

async function connectAI(){
  if(client) return client;
  loadingText.textContent = "AI 모델 연결 중…";
  loading.style.display = "flex";
  try{
    client = await Client.connect(SPACE);
    loading.style.display = "none";
    return client;
  }catch(e){
    loading.style.display = "none";
    client = null;
    throw e;
  }
}

function captureFrame(){
  const vw = video.videoWidth || 1280;
  const vh = video.videoHeight || 720;

  // Limit upload size to keep mobile inference practical while preserving
  // enough facial detail for the removal model.
  const maxW = 1024;
  const scale = Math.min(1, maxW / vw);
  canvas.width = Math.round(vw * scale);
  canvas.height = Math.round(vh * scale);

  const c = canvas.getContext("2d");
  c.save();
  // The browser preview is mirrored; send a normal-orientation image to AI.
  c.translate(canvas.width,0);
  c.scale(-1,1);
  c.drawImage(video,0,0,canvas.width,canvas.height);
  c.restore();

  return new Promise(resolve=>canvas.toBlob(resolve,"image/jpeg",0.92));
}

function extractImageUrl(data){
  if(!data) return null;
  const x = Array.isArray(data) ? data[0] : data;
  if(typeof x === "string") return x;
  if(x && typeof x.url === "string") return x.url;
  if(x && typeof x.path === "string") return x.path;
  if(x && typeof x.data === "string" && x.data.startsWith("data:")) return x.data;
  return null;
}

async function removeGlasses(){
  if(busy) return;
  busy = true;
  aiBtn.disabled = true;
  loading.style.display = "flex";
  loadingText.textContent = "AI가 안경과 렌즈를 분석하는 중…";
  setMessage("잠시만요. 얼굴과 눈 모양을 최대한 유지해서 복원합니다.");

  try{
    const blob = await captureFrame();
    const api = await connectAI();

    /*
     * The public Hugging Face Space is a dedicated glasses-removal demo.
     * Endpoint names can change as the Space is updated, so try the common
     * Gradio prediction endpoints in order rather than hard-coding one UI.
     */
    let prediction;
    const file = await handle_file(blob);

    const candidates = [
      {api_name:"/predict", data:[file]},
      {api_name:"/remove_glasses", data:[file]},
      {api_name:"/inference", data:[file]},
      {api_name:"/run", data:[file]}
    ];

    let lastError = null;
    for(const candidate of candidates){
      try{
        prediction = await api.predict(candidate.api_name, candidate.data);
        if(prediction && prediction.data) break;
      }catch(e){ lastError = e; }
    }

    if(!prediction || !prediction.data){
      throw lastError || new Error("AI endpoint를 찾지 못했습니다.");
    }

    const url = extractImageUrl(prediction.data);
    if(!url) throw new Error("AI 결과 이미지를 읽지 못했습니다.");

    result.src = url;
    await new Promise((resolve,reject)=>{
      result.onload = resolve;
      result.onerror = reject;
    });

    video.style.display = "none";
    result.style.display = "block";
    againBtn.style.display = "block";
    aiBtn.style.display = "none";
    status.textContent = "AI 안경 제거 결과";
    setMessage("안경 제거 완료");
  }catch(e){
    console.error(e);
    setMessage("AI 처리에 실패했습니다. 잠시 후 다시 시도해주세요.");
    status.textContent = "AI 연결 오류";
    alert(
      "AI 안경 제거에 실패했습니다.\\n\\n" +
      "처음 실행할 때 모델 로딩 시간이 길 수 있습니다.\\n" +
      "계속 실패하면 Hugging Face Space가 일시적으로 대기/중지 상태일 수 있습니다."
    );
  }finally{
    loading.style.display = "none";
    busy = false;
    aiBtn.disabled = false;
  }
}

function showCamera(){
  result.style.display = "none";
  video.style.display = "block";
  againBtn.style.display = "none";
  aiBtn.style.display = "block";
  status.textContent = "카메라 ON";
  setMessage("얼굴을 화면 중앙에 맞춘 뒤 AI 안경 제거를 눌러주세요.");
}

aiBtn.addEventListener("click", removeGlasses);
againBtn.addEventListener("click", showCamera);
startCamera();
</script>
</body>
</html>
